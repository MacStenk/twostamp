name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install --quiet opentimestamps-client || pip3 install --quiet --break-system-packages opentimestamps-client
      - run: bash test/run.sh
